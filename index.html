<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>subash - Movie Ticket Booking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <!-- Navigation Bar -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <div
            class="flex items-center cursor-pointer"
            onclick="router('home')"
          >
            <span class="text-2xl font-black text-rose-500 tracking-wider"
              >MOVIENEST</span
            >
          </div>
          <!-- Locate the navbar inside index.html and update the button group -->
          <div class="flex items-center space-x-4">
            <button
              onclick="toggleTheme()"
              id="theme-toggle-btn"
              class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg font-medium transition text-sm border border-slate-700"
            >
              🌙 Dark Mode
            </button>

            <button
              onclick="window.location.href = 'admin.html'"
              class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-lg font-medium transition text-sm"
            >
              Admin
            </button>

            <div id="auth-nav-container">
              <!-- Auth controls populate dynamically -->
              <button
                onclick="openAuthModal('login')"
                class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg font-medium transition"
              >
                Login
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Dynamic Container -->
    <main id="app-view" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Rendered dynamically via app.js -->
    </main>

    <!-- Authentication Modal -->
    <div
      id="auth-modal"
      class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50"
    >
      <div
        class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md relative"
      >
        <button
          onclick="closeAuthModal()"
          class="absolute top-4 right-4 text-slate-400 hover:text-white"
        >
          &times;
        </button>

        <!-- Tab Switchers -->
        <div class="flex border-b border-slate-800 mb-6">
          <button
            onclick="switchAuthTab('login')"
            id="tab-login"
            class="flex-1 pb-3 text-center font-bold text-rose-500 border-b-2 border-rose-500 transition"
          >
            Sign In
          </button>
          <button
            onclick="switchAuthTab('signup')"
            id="tab-signup"
            class="flex-1 pb-3 text-center font-bold text-slate-400 border-b-2 border-transparent transition"
          >
            Create Account
          </button>
        </div>

        <h2 id="auth-modal-title" class="text-xl font-bold mb-4 text-white">
          Welcome Back
        </h2>

        <form
          id="auth-form"
          onsubmit="handleAuthSubmit(event)"
          class="space-y-4"
        >
          <!-- Extra Fields for Sign Up (Hidden by default) -->
          <div id="signup-extra-fields" class="hidden space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1"
                >Full Name</label
              >
              <input
                type="text"
                id="auth-name"
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-rose-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1"
                >Phone Number</label
              >
              <input
                type="tel"
                id="auth-phone"
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-rose-500"
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-400 mb-1"
              >Email Address</label
            >
            <input
              type="email"
              id="auth-email"
              required
              class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-rose-500"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-400 mb-1"
              >Password</label
            >
            <input
              type="password"
              id="auth-password"
              required
              minlength="6"
              class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-rose-500"
            />
            <p class="text-xs text-slate-500 mt-1">
              Must be at least 6 characters.
            </p>
          </div>

          <button
            type="submit"
            id="auth-submit-btn"
            class="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium py-2.5 rounded-lg transition shadow-lg shadow-rose-600/20"
          >
            Sign In
          </button>
        </form>

        <!-- Google OAuth Button -->
        <div class="mt-4">
          <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-slate-800"></div>
            <span
              class="flex-shrink mx-4 text-slate-500 text-xs uppercase tracking-wider"
              >Or</span
            >
            <div class="flex-grow border-t border-slate-800"></div>
          </div>

          <button
            type="button"
            onclick="handleGoogleSignIn()"
            class="w-full mt-2 flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 py-2.5 rounded-lg font-medium transition text-sm"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1.02 10.22 1.02 12s.41 3.45 1.16 4.94l2.85-2.22.81-.63z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              />
            </svg>
            Continue with Google
          </button>
        </div>
      </div>
    </div>

    <!-- jsPDF Library for Ticket Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
